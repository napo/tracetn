 | 46.193 |\n| Lavoratori in uscita | 123.0 | 44.235 | 78.765 |\n| Saldo netto | -47.000 | -14.428 | -32.572 |\n| Intensit\u00e0 pendolarismo | 0.023 | 0.022 | 0.001 |\n| Autocontenimento (%) | 0.137 | 0.108 | 0.029 |\n| Attrattivit\u00e0 (%) | 0.009 | 0.007 | 0.001 |\n| Indice di bilancio (in/out) | 0.618 | 0.802 | -0.184 |\n| Accessibilit\u00e0 potenziale (km, \u03b2=1.5) | 2777.4 | 3566.9 | -789.6 |\n| R50 (km) | 45.396 | 52.356 | -6.960 |\n| T50 (min) | 39.000 | 49.892 | -10.892 |\n| Comuni entro 20 km | 9.000 | 13.843 | -4.843 |\n| Comuni entro 30 min | 18.000 | 25.819 | -7.819 |\n\n**Comuni simili:** [Fai della Paganella](#fai-della-paganella), [Folgaria](#folgaria), [San Lorenzo Dorsino](#san-lorenzo-dorsino), [Luserna / Lus\u00e9rn](#luserna--lusern), [Cavedine](#cavedine)\n---\n\n<a id=\"albiano\"></a>\n## Albiano\n\nIl comune di **Albiano** si caratterizza come un comune a prevalenza **residenziale** (pi\u00f9 lavoratori in uscita che in entrata), con un livello di **attrattivit\u00e0 lavorativa** basso (Q1) e **autocontenimento** alto (Q4), e un\u2019**accessibilit\u00e0** (R50 km / T50 min) classificata come alto (Q4) / alto (Q4).\n\n| Indicatore | Valore | Media provinciale | \u0394 (Valore \u2212 Media) |\n|---|---:|---:|---:|\n| Popolazione | 1.497 | 3262.6 | -1765.6 |\n| Lavoratori in entrata | 0.000 | 29.807 | -29.807 |\n| Lavoratori in uscita | 20.000 | 44.235 | -24.235 |\n| Saldo netto | -20.000 | -14.428 | -5.572 |\n| Intensit\u00e0 pendolarismo | 0.013 | 0.022 | -0.008 |\n| Autocontenimento (%) | 0.138 | 0.108 | 0.030 |\n| Attrattivit\u00e0 (%) | 0.000 | 0.007 | -0.007 |\n| Indice di bilancio (in/out) | 0.000 | 0.802 | -0.802 |\n| Accessibilit\u00e0 potenziale (km, \u03b2=1.5) | 4597.5 | 3566.9 | 1030.6 |\n| R50 (km) | 38.993 | 52.356 | -13.363 |\n| T50 (min) | 34.000 | 49.892 | -15.892 |\n| Comuni entro 20 km | 15.000 | 13.843 | 1.157 |\n| Comuni entro 30 min | 36.000 | 25.819 | 10.181 |\n\n**Comuni simili:** [Denno](#denno), [Cembra Lisignago]       tbl.classList.add('table','table-striped','table-hover','table-bordered','align-middle','table-sm');
      const wrap = document.createElement('div');
      wrap.className = 'table-responsive';
      tbl.parentNode.insertBefore(wrap, tbl);
      wrap.appendChild(tbl);
    });

    // 3) Build TOC from H1/H2 (comuni)
    const toc = document.getElementById('tocNav');
    const headings = root.querySelectorAll('h1, h2');
    const tocItems = [];
    headings.forEach(h => {
      const id = h.id || h.textContent.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'');
      if (!h.id) h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.className = 'list-group-item list-group-item-action';
      a.textContent = h.textContent.trim();
      toc.appendChild(a);
      tocItems.push(a);
    });

    // 4) Filter TOC
    const tocSearch = document.getElementById('tocSearch');
    tocSearch?.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      tocItems.forEach(a => {
        a.style.display = a.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });

    // 5) Close offcanvas on TOC item click and smooth scroll
    const offcanvasEl = document.getElementById('offcanvasTOC');
    const offcanvasInstance = bootstrap.Offcanvas.getOrCreateInstance(offcanvasEl);
    document.querySelectorAll('#tocNav a').forEach(a => {
      a.addEventListener('click', (e) => {
        // let default anchor behavior occur (ScrollSpy + native scroll)
        // but also close the menu for better UX
        if (window.getComputedStyle(offcanvasEl).visibility !== 'hidden') {
          offcanvasInstance.hide();
        }
      });
    });

    // 6) Global content search
    const globalSearch = document.getElementById('globalSearch');
    globalSearch.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = globalSearch.value.trim();
        if (!q) return;
        // remove previous highlights
        root.querySelectorAll('mark.search-hit').forEach(m => m.replaceWith(m.textContent));
        // highlight new ones
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        let firstEl = null;
        while (walker.nextNode()) {
          const node = walker.currentNode;
          const idx = node.data.toLowerCase().indexOf(q.toLowerCase());
          if (idx !== -1 && node.parentElement && !['SCRIPT','STYLE'].includes(node.parentElement.tagName)) {
            const span = document.createElement('span');
            span.innerHTML = node.data.substring(0, idx) + '<mark class="search-hit">' + node.data.substring(idx, idx + q.length) + '</mark>' + node.data.substring(idx + q.length);
            node.parentNode.replaceChild(span, node);
            if (!firstEl) firstEl = span.querySelector('mark');
          }
        }
        if (firstEl) firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    // 7) External links target
    root.querySelectorAll('a[href^="http"]').forEach(a => a.target = '_blank');

    // 8) Style code blocks
    root.querySelectorAll('pre').forEach(pre => pre.classList.add('p-3','bg-light','rounded'));

    // 9) Initialize ScrollSpy on body
    const scrollSpy = new bootstrap.ScrollSpy(document.body, {
      target: '#tocNav',
      offset: 80
    });
  </script>
</body>
</html>
